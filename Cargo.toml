[package]
name = "vaultlint"
version = "0.1.1"
edition = "2021"
rust-version = "1.86"
description = "Security linter for Solana and Anchor programs"
repository = "https://github.com/vaultlint/vaultlint"
homepage = "https://vaultlint.com"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["solana", "anchor", "security", "linter", "static-analysis"]
categories = ["development-tools"]
autoexamples = false
# The package carries the tool: sources, tests, examples, README, changelog, licences.
# Everything under docs/ is research and working notes — the measurement reports, the
# census script, the design spec, the undecided product options. Their home is the
# repository and the site, where they are read and linked, not the tarball someone
# downloads to install a linter. Excluding them changes nothing about who can read
# them: all of it stays public in the repository.
exclude = [".superpowers/", ".github/", "docs/"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
toml = "0.8"
walkdir = "2"
quote = "1"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
